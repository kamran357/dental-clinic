<!-- Prime Design mobile menu — hamburger + slide-out drawer -->
<style>
/* Mobile drawer — overrides Webflow nav on screens ≤991px */
@media(max-width:991px){
  /* Hide the original Webflow nav menu completely on mobile */
  .navbar_menu.w-nav-menu{display:none!important}
  /* Make the hamburger button always visible on mobile */
  .navbar-toggler-button{display:block!important;z-index:10001}
  /* Animate hamburger bars to X when open */
  .navbar-toggler-button.w--open .navbar-toggler_bar_top{transform:translateY(7px) rotate(45deg);transition:transform .3s ease}
  .navbar-toggler-button.w--open .navbar-toggler_bar-middle{opacity:0;transition:opacity .2s ease}
  .navbar-toggler-button.w--open .navbar_toggler-bar-bottom{transform:translateY(-7px) rotate(-45deg);transition:transform .3s ease}
}
/* Drawer overlay */
.pd-drawer-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(1,31,35,.45);backdrop-filter:blur(3px);opacity:0;transition:opacity .3s ease}
.pd-drawer-overlay.active{display:block;opacity:1}
/* Drawer panel */
.pd-drawer{position:fixed;top:0;right:0;width:320px;max-width:85vw;height:100vh;z-index:10000;background:#fff;box-shadow:-8px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.pd-drawer.open{transform:translateX(0)}
/* Drawer header */
.pd-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #eef1f3;flex-shrink:0}
.pd-drawer-header img{height:26px}
.pd-drawer-close{background:none;border:none;cursor:pointer;padding:4px;color:#445;font-size:0;line-height:0}
.pd-drawer-close svg{width:24px;height:24px}
/* Drawer nav links */
.pd-drawer-nav{flex:1;padding:16px 0;overflow-y:auto}
.pd-drawer-nav a{display:flex;align-items:center;gap:10px;padding:13px 24px;font-family:'Sora',sans-serif;font-size:15px;font-weight:500;color:#011f23;text-decoration:none;transition:background .15s,color .15s}
.pd-drawer-nav a:hover,.pd-drawer-nav a:focus{background:#f0fafb;color:#24a3b1}
.pd-drawer-nav a.active{color:#24a3b1;font-weight:600}
.pd-drawer-nav a svg{width:18px;height:18px;flex-shrink:0;opacity:.6}
/* Drawer CTA */
.pd-drawer-cta{padding:16px 24px 24px;border-top:1px solid #eef1f3;flex-shrink:0}
.pd-drawer-cta a{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;background:linear-gradient(135deg,#3fc7d6,#24a3b1);color:#fff;border-radius:10px;font-family:'Sora',sans-serif;font-size:15px;font-weight:600;text-decoration:none;transition:opacity .2s}
.pd-drawer-cta a:hover{opacity:.9}
.pd-drawer-cta a svg{width:16px;height:16px}
/* Drawer footer */
.pd-drawer-footer{padding:16px 24px;border-top:1px solid #eef1f3;flex-shrink:0}
.pd-drawer-footer-links{display:flex;gap:16px;flex-wrap:wrap}
.pd-drawer-footer-links a{font-size:12px;color:#667;text-decoration:none;transition:color .15s}
.pd-drawer-footer-links a:hover{color:#24a3b1}
.pd-drawer-social{display:flex;gap:12px;margin-top:12px}
.pd-drawer-social a{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:#f5f7f8;color:#445;transition:background .15s,color .15s}
.pd-drawer-social a:hover{background:#e8f8f5;color:#24a3b1}
.pd-drawer-social a svg{width:16px;height:16px}
/* Body scroll lock */
body.pd-drawer-open{overflow:hidden}
</style>

<script>
(function(){
  var btn=document.querySelector('.navbar-toggler-button');
  var drawer=document.getElementById('pd-drawer');
  var overlay=document.getElementById('pd-drawer-overlay');
  var closeBtn=document.getElementById('pd-drawer-close');
  if(!btn||!drawer||!overlay)return;

  function openDrawer(){
    drawer.classList.add('open');
    overlay.classList.add('active');
    btn.classList.add('w--open');
    document.body.classList.add('pd-drawer-open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    overlay.classList.remove('active');
    btn.classList.remove('w--open');
    document.body.classList.remove('pd-drawer-open');
  }

  btn.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    if(drawer.classList.contains('open'))closeDrawer();else openDrawer();
  });
  overlay.addEventListener('click',closeDrawer);
  closeBtn.addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer();});

  /* Close drawer when clicking any nav link inside it */
  drawer.querySelectorAll('.pd-drawer-nav a, .pd-drawer-cta a').forEach(function(a){
    a.addEventListener('click',function(){
      /* Don't close if it's a modal trigger */
      if(a.getAttribute('href')==='#appointment'||a.getAttribute('href')==='#contact')return;
      closeDrawer();
    });
  });

  /* Set active link based on current page */
  var page=location.pathname.split('/').pop()||'index.html';
  drawer.querySelectorAll('.pd-drawer-nav a').forEach(function(a){
    if(a.getAttribute('href')===page)a.classList.add('active');
  });
})();
</script>
