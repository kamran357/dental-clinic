<!-- Prime Design cookie consent banner -->
<style>
.pd-cookie-banner{position:fixed;bottom:0;left:0;right:0;z-index:9998;background:#011f23;color:#c8d6de;padding:0;transform:translateY(100%);transition:transform .45s cubic-bezier(.4,0,.2,1);box-shadow:0 -4px 30px rgba(0,0,0,.25)}
.pd-cookie-banner.show{transform:translateY(0)}
.pd-cookie-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:20px 28px}
.pd-cookie-icon{flex-shrink:0;width:40px;height:40px;background:linear-gradient(135deg,#3fc7d6,#24a3b1);border-radius:10px;display:flex;align-items:center;justify-content:center}
.pd-cookie-icon svg{width:22px;height:22px;color:#fff}
.pd-cookie-text{flex:1}
.pd-cookie-text h4{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;color:#fff;margin:0 0 4px}
.pd-cookie-text p{font-size:13px;line-height:1.55;color:#94a8b3;margin:0}
.pd-cookie-text a{color:#3fc7d6;text-decoration:underline;text-underline-offset:2px;transition:color .15s}
.pd-cookie-text a:hover{color:#5dd8e4}
.pd-cookie-actions{display:flex;gap:10px;flex-shrink:0;align-items:center}
.pd-cookie-btn{border:none;border-radius:8px;font-family:'Sora',sans-serif;font-size:13px;font-weight:600;cursor:pointer;padding:10px 20px;transition:all .2s;white-space:nowrap}
.pd-cookie-btn-accept{background:linear-gradient(135deg,#3fc7d6,#24a3b1);color:#fff}
.pd-cookie-btn-accept:hover{opacity:.9;transform:translateY(-1px)}
.pd-cookie-btn-reject{background:transparent;color:#94a8b3;border:1.5px solid #3a5060}
.pd-cookie-btn-reject:hover{border-color:#6b8a9a;color:#c8d6de}
.pd-cookie-btn-settings{background:transparent;color:#3fc7d6;border:none;padding:10px 12px;font-weight:500}
.pd-cookie-btn-settings:hover{color:#5dd8e4}
@media(max-width:640px){
  .pd-cookie-inner{flex-direction:column;align-items:stretch;text-align:center;padding:20px}
  .pd-cookie-icon{margin:0 auto}
  .pd-cookie-actions{justify-content:center;flex-wrap:wrap}
}
</style>

<div class="pd-cookie-banner" id="pd-cookie-banner">
  <div class="pd-cookie-inner">
    <div class="pd-cookie-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v.01M12 12v.01M12 18v.01M8 10a1 1 0 100-2 1 1 0 000 2zM15 9a1 1 0 100-2 1 1 0 000 2zM9 15a1 1 0 100-2 1 1 0 000 2z"/></svg>
    </div>
    <div class="pd-cookie-text">
      <h4>We value your privacy</h4>
      <p>We use cookies to enhance your browsing experience, serve personalized content, and analyze our traffic. By clicking "Accept All", you consent to our use of cookies. Read our <a href="cookies.html">Cookie Policy</a> for details.</p>
    </div>
    <div class="pd-cookie-actions">
      <button class="pd-cookie-btn pd-cookie-btn-reject" id="pd-cookie-reject">Reject</button>
      <button class="pd-cookie-btn pd-cookie-btn-accept" id="pd-cookie-accept">Accept All</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* Check if consent already given */
  if(localStorage.getItem('pd_cookie_consent'))return;

  var banner=document.getElementById('pd-cookie-banner');
  if(!banner)return;

  /* Show banner after 1.5s delay */
  setTimeout(function(){banner.classList.add('show');},1500);

  /* Accept button */
  document.getElementById('pd-cookie-accept').addEventListener('click',function(){
    localStorage.setItem('pd_cookie_consent','accepted');
    banner.classList.remove('show');
  });

  /* Reject button */
  document.getElementById('pd-cookie-reject').addEventListener('click',function(){
    localStorage.setItem('pd_cookie_consent','rejected');
    banner.classList.remove('show');
  });
})();
</script>
<!-- /Prime Design cookie consent banner -->
